name: Tests
on: [push, pull_request]
jobs:
  test:
    name: Lab 1 · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  lab2:
    name: Lab 2 · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: lab2
        shell: bash
    env:
      # UI- и e2e-тесты не должны тихо пропускаться из-за отсутствия дисплея.
      REQUIRE_GUI: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          echo "GUI=xvfb-run -a" >> "$GITHUB_ENV"
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -t . -v
      - name: UI tests
        run: $GUI python -m unittest discover -s tests/ui -t . -v
      - name: E2E tests
        run: $GUI python -m unittest discover -s tests/e2e -t . -v
